name: Release publish
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (Beta is published as prerelease)'
        required: true
        default: Beta
        type: choice
        options:
          - Release
          - Beta
      version:
        description: 'Version to release (e.g., 2.14.2)'
        required: true
        type: string

jobs:
  build:
    # ... 保留原样，但需确保 reusable-build.yml 存在 ...
  changelog:
    # ... 保留原样 ...
  rename_and_release:
    needs: [build, changelog]
    permissions:
      actions: read
      contents: write
      # id-token: write  # 如果删除签名步骤，这行也可以删掉
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - configuration: ${{ inputs.configuration }}
            architecture: x64
          - configuration: ${{ inputs.configuration }}
            architecture: ARM64
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@...
        with:
          name: PCL2_CE_${{ matrix.configuration }}_${{ matrix.architecture }}
          path: ./artifact
      - name: Rename binaries
        run: mv "./artifact/Plain Craft Launcher 2.exe" "PCL2_CE_${{ matrix.configuration }}_${{ matrix.architecture }}.exe"
      # 删除 Sign 步骤
      - name: Upload binary to Release
        uses: softprops/action-gh-release@...
        with:
          draft: true
          tag_name: v${{ inputs.version }}
          files: PCL2_CE_${{ matrix.configuration }}_${{ matrix.architecture }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish_draft:
    needs: [rename_and_release]
    runs-on: ubuntu-latest
    steps:
      - name: Publish Draft
        uses: softprops/action-gh-release@...
        with:
          tag_name: v${{ inputs.version }}
      # 删除 Trigger MirrorChyanUploading 和 Trigger MirrorChyanReleaseNote
